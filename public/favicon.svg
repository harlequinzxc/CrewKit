<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Warm Glow Pooling Beneath -->
    <radialGradient id="pwaGlow" cx="50%" cy="58%" r="42%">
      <stop offset="0%" stop-color="#D4AF7A" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#B78D55" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#B78D55" stop-opacity="0" />
    </radialGradient>

    <!-- Lit Upper Wing Gradient -->
    <linearGradient id="pwaLitWing" x1="227" y1="123" x2="432" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF2DC" />
      <stop offset="50%" stop-color="#E9CFA5" />
      <stop offset="100%" stop-color="#D4AF7A" />
    </linearGradient>

    <!-- Main Boarding Pass Wing / Body Gradient -->
    <linearGradient id="pwaMainBody" x1="248" y1="180" x2="381" y2="381" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2C192" />
      <stop offset="50%" stop-color="#D4AF7A" />
      <stop offset="100%" stop-color="#B78D55" />
    </linearGradient>

    <!-- Fold Shadow Gradient -->
    <linearGradient id="pwaFoldShadow" x1="190" y1="272" x2="287" y2="333" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B78D55" />
      <stop offset="100%" stop-color="#785322" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Midnight Field (Maskable Requirement) -->
  <rect width="512" height="512" fill="#0B0E14" />

  <!-- 18% Safe-Zone Centered Mark -->
  <!-- Faint Warm Glow Beneath -->
  <circle cx="256" cy="298" r="180" fill="url(#pwaGlow)" />

  <!-- 5 Fading Runway-Light Dots -->
  <circle cx="96" cy="416" r="6" fill="#B78D55" opacity="0.22" />
  <circle cx="120" cy="395" r="7.5" fill="#B78D55" opacity="0.38" />
  <circle cx="150" cy="371" r="9" fill="#D4AF7A" opacity="0.58" />
  <circle cx="182" cy="344" r="10.5" fill="#D4AF7A" opacity="0.78" />
  <circle cx="217" cy="315" r="12" fill="#E9CFA5" opacity="0.95" />

  <!-- Underbody Fold Shadows -->
  <path d="M 190 333 L 248 272 L 226 312 Z" fill="url(#pwaFoldShadow)" />
  <path d="M 226 312 L 248 272 L 287 333 Z" fill="url(#pwaFoldShadow)" />

  <!-- Lit Upper Wing Facet -->
  <path d="M 432 94 L 227 123 L 248 272 Z" fill="url(#pwaLitWing)" />
  <!-- Lit Top Edge Highlight -->
  <path d="M 227 123 L 432 94" stroke="#FFF5E4" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />

  <!-- Main Boarding Pass Wing / Body Facet -->
  <path d="M 432 94 L 248 272 L 381 381 Z" fill="url(#pwaMainBody)" />

  <!-- Perforated Tear-Line across Wing -->
  <line x1="310" y1="185" x2="364" y2="300" stroke="#0B0E14" stroke-width="8" stroke-dasharray="8 10" stroke-linecap="round" opacity="0.85" />
  <line x1="310" y1="185" x2="364" y2="300" stroke="#FFF2DC" stroke-width="3" stroke-dasharray="8 10" stroke-linecap="round" opacity="0.9" />

  <!-- Center Spine Fold Highlight -->
  <line x1="432" y1="94" x2="248" y2="272" stroke="#FFF2DC" stroke-width="3" opacity="0.7" />
</svg>
